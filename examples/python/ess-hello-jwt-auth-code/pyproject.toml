[project]
name = "ess-hello-jwt-auth-code"
version = "0.1.0"
description = "Obtain a JWT access token from any OpenID Connect provider via the OAuth 2.0 Authorization Code Flow with PKCE"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
keywords = ["oauth2", "oidc", "jwt", "pkce", "authorization-code"]
dependencies = [
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
ess-hello-jwt-auth-code = "ess_hello_jwt_auth_code.main:main"

[dependency-groups]
dev = ["ruff>=0.14.2", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_hello_jwt_auth_code"]
exclude = ["**/test_*.py"]
