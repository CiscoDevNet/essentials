- id: ess-scan
  name: ess-scan (secrets, jargon, PII in ess-* items)
  description: >-
    Runs the ess-git-repo-sync deterministic scanners on each changed ess-* item
    and fails on critical findings. The jargon terms come from jargon.json at
    the repo root (rename it with args: [--jargon-file, <name>]); with no
    terms the hook fails. Needs Node.js 24 or later and npm on PATH;
    trufflehog is used when installed.
  # A script, not `language: node`: pre-commit would install this repo into
  # node_modules, where Node refuses to strip TypeScript types. The entry needs
  # no install; secretlint comes from npx.
  entry: skills/ess/ess-git-repo-sync/scripts/src/ess-scan.ts
  language: script
  files: '(^|/)ess-[^/]+/|(^|/)ess/ess-[^/]+$'
  require_serial: true
