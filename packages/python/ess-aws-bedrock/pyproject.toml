[project]
name = "ess-aws-bedrock"
version = "0.1.0"
description = "AWS Bedrock Anthropic model access with Pulumi"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pulumi>=3.202.0,<4.0.0",
    "pulumi-aws>=6.0.0",
    "pulumi-utils",
]

[tool.uv.sources]
pulumi-utils = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_aws_bedrock"]
exclude = ["**/test_*.py"]
