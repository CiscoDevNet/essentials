[project]
name = "ess-dirs"
version = "0.1.0"
description = "Secure filesystem helpers (write files with restrictive permissions)."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_dirs"]
exclude = ["**/test_*.py"]
