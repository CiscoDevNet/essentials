[project]
name = "ess-outlook"
version = "0.1.0"
description = "CLI tool for reading and managing Microsoft Outlook emails via Microsoft Graph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "ess-dirs",
    "msal>=1.28.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
ess-outlook = "ess_outlook.__main__:main"

[tool.uv.sources]
ess-dirs = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_outlook"]
exclude = ["**/test_*.py"]
