[project]
name = "ess-load-test"
version = "0.1.0"
description = "Generic EC2 Locust load testing engine and CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0",
    "click>=8.1",
    "ess-auth",
    "ess-browser",
    "locust>=2.32,<3",
    "pulumi>=3.0.0",
    "pulumi-aws>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
ess-load-test = "ess_load_test.__main__:cli_entry"

[tool.uv.sources]
ess-auth = { workspace = true }
ess-browser = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_load_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
