[project]
name = "ess-webex"
version = "0.1.0"
description = "CLI tool for interacting with Webex rooms, messages, teams, and meetings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "ess-dirs",
    "python-dotenv>=1.0.0",
    "wxc-sdk>=1.32.0",
]

[project.scripts]
ess-webex = "ess_webex.__main__:main"

[tool.uv.sources]
ess-dirs = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_webex"]
exclude = ["**/test_*.py"]
