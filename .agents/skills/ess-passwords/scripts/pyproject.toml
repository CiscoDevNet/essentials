[project]
name = "ess-passwords"
version = "0.1.0"
description = "Readable password generation from a filtered EFF wordlist"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "xkcdpass>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ess-passwords = "ess_passwords.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Consumers install this as a non-editable path dependency; rebuild it when
# the source changes rather than only when pyproject.toml does.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.hatch.build]
exclude = ["**/test_*.py"]

# pytest would otherwise write .pytest_cache here, inside the skill, where
# the skill installer copies it.
[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_passwords"]
